services:
  postgres:
    image: 'postgres:16-alpine'
    environment:
      - 'POSTGRES_DB=${POSTGRES_DB:-velocrmdb}'
      - 'POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-secret}'
      - 'POSTGRES_USER=${POSTGRES_USER:-myuser}'
    ports:
      - '5432:5432'
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  pgadmin:
    image: 'dpage/pgadmin4:9.17'
    environment:
      - 'PGADMIN_DEFAULT_EMAIL=${PGADMIN_DEFAULT_EMAIL:-admin@velocrm.com}'
      - 'PGADMIN_DEFAULT_PASSWORD=${PGADMIN_DEFAULT_PASSWORD:-admin}'
    ports:
      - '5050:80'
    depends_on:
      - postgres

  redis:
    image: 'redis:7-alpine'
    ports:
      - '6379:6379'
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  core:
    build: ./core
    ports:
      - '8080:8080'
    dns:
      - 8.8.8.8
    environment:

      - 'SPRING_PROFILES_ACTIVE=supabase'
      # Repassando do .env para dentro do container
      - 'SUPABASE_DB_HOST=${SUPABASE_DB_HOST}'
      - 'SUPABASE_DB_PORT=${SUPABASE_DB_PORT}'
      - 'SUPABASE_DB_NAME=${SUPABASE_DB_NAME}'
      - 'SUPABASE_DB_USER=${SUPABASE_DB_USER}'
      - 'SUPABASE_DB_PASSWORD=${SUPABASE_DB_PASSWORD}'
      - 'SUPABASE_DB_SSL_MODE=${SUPABASE_DB_SSL_MODE}'
      - 'SUPABASE__URL=${SUPABASE__URL}'
      - 'SPRING_DATA_REDIS_HOST=redis'
      - 'SPRING_DATA_REDIS_PORT=6379'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build: ./worker
    environment:
      - 'REDIS_HOST=redis'
      - 'REDIS_PORT=6379'
      - 'CORE_API_URL=http://core:8080'
    depends_on:
      redis:
        condition: service_healthy
      core:
        condition: service_started

  frontend:
    build: ./frontend
    ports:
      - '3000:3000'
    environment:
      - 'API_BASE_URL=http://localhost:8080'
    depends_on:
      - core
